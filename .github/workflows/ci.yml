name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Typecheck + verifiability gates + smoke + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict module graph)
        run: npm run typecheck

      - name: Verifiability gates (invariants, energy drift, determinism, save/load, story)
        run: npx tsx tools/verify.ts

      - name: Headless full-stack smoke test
        run: npx tsx tools/smoke.mts

      - name: Build is reproducible (esbuild output matches committed dist/ + ThreeBody.html)
        run: |
          npm run build
          git diff --exit-code -- dist/three-body.js ThreeBody.html \
            || (echo "::error::Build output is out of date — run 'npm run build' and commit dist/three-body.js + ThreeBody.html." && exit 1)
