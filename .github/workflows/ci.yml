name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Verifiability gates + smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install — the tools are zero-dependency Node scripts.
      - name: Verifiability gates (state invariants, energy drift, determinism, save/load)
        run: node tools/verify.js

      - name: Headless full-stack smoke test
        run: node tools/smoke.js

      - name: Bundle is reproducible (single-file build matches committed ThreeBody.html)
        run: |
          node tools/bundle.js
          git diff --exit-code -- ThreeBody.html \
            || (echo "::error::ThreeBody.html is out of date — run 'npm run bundle' and commit the result." && exit 1)
